name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # عنوان موقع Vercel الذي تعمل عليه دالة المساعد الذكي
      VITE_API_BASE: https://cook-sheeyseite1.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nakha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nakha-apk
          path: nakha.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: نكهة APK #${{ github.run_number }}
          body: حمّل ملف nakha.apk وثبّته على هاتف أندرويد.
          files: nakha.apk
